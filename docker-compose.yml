version: '3.8'

services:
  # 1. База данных PostgreSQL
  postgres_db:
    image: postgres:16-alpine
    container_name: pool_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: pool_finance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Веб-интерфейс для просмотра базы (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pool_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pooltracker.org
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_db

volumes:
  postgres_data: